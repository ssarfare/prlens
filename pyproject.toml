[project]
name = "prlens"
version = "0.1.0"
description = "AI-powered pull request reviewer"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]

[project.scripts]
prlens = "prlens.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
