[project]
name = "prlens"
version = "0.1.0"
description = "AI-powered pull request reviewer"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "unidiff>=1.0.1",
    "litellm>=1.103.0",
    "pydantic>=2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "pytest-cov>6.0",
    "ruff>=0.13"
]

[project.scripts]
prlens = "prlens.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear
    "UP"   # pyupgrade
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
addopts = "--cov=prlens --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["prlens"]

[tool.coverage.report]
show_missing = true
skip_covered = true